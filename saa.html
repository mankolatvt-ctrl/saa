<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mankolan koulun sää</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden;
              background-color:#e7e0cf; font-family:"Work Sans",Arial,sans-serif; color:#1f3a2e; }

  #stage {
    position:absolute; top:0; left:0; width:1345px; height:980px;
    -webkit-transform-origin:top left; transform-origin:top left;
    background-color:#f7f3ea;
    display:-webkit-box; display:-webkit-flex; display:flex;
    -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column;
    overflow:hidden;
  }

  .head {
    -webkit-box-flex:0; -webkit-flex:0 0 auto; flex:0 0 auto;
    display:-webkit-box; display:-webkit-flex; display:flex;
    -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column;
    -webkit-box-align:center; -webkit-align-items:center; align-items:center;
    text-align:center; padding:34px 0 20px; border-bottom:2px solid #1f3a2e;
  }
  .head h1 { font-family:"Fraunces",serif; font-weight:500; font-size:30px; margin:0 0 6px; letter-spacing:.3px; }
  .head .when { font-size:16px; color:#4d6157; }

  .now {
    -webkit-box-flex:0; -webkit-flex:0 0 auto; flex:0 0 auto;
    display:-webkit-box; display:-webkit-flex; display:flex;
    -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column;
    -webkit-box-align:center; -webkit-align-items:center; align-items:center;
    text-align:center; padding:34px 0 26px; border-bottom:1px solid #d9d2c1;
  }
  .now .icon { margin-bottom:8px; }
  .now .icon svg { width:100px; height:100px; }
  .now .temp { font-family:"Fraunces",serif; font-weight:600; font-size:88px; line-height:1; margin-bottom:8px; }
  .now .desc { font-size:20px; color:#4d6157; }

  .stats {
    -webkit-box-flex:0; -webkit-flex:0 0 auto; flex:0 0 auto;
    display:-webkit-box; display:-webkit-flex; display:flex;
    -webkit-box-pack:center; -webkit-justify-content:center; justify-content:center;
    padding:22px 0 26px; border-bottom:1px solid #d9d2c1;
  }
  .stat { text-align:center; margin:0 35px; }
  .stat .label { font-size:14px; color:#4d6157; }
  .stat .value { font-family:"Fraunces",serif; font-size:26px; font-weight:500; margin-top:3px; }

  .section-title { -webkit-box-flex:0; -webkit-flex:0 0 auto; flex:0 0 auto;
    font-size:15px; color:#4d6157; text-align:center; margin:26px 0 16px; }

  .hours {
    -webkit-box-flex:1; -webkit-flex:1; flex:1;
    display:-webkit-box; display:-webkit-flex; display:flex;
    -webkit-box-pack:center; -webkit-justify-content:center; justify-content:center;
    -webkit-box-align:start; -webkit-align-items:flex-start; align-items:flex-start;
    padding:0 40px;
  }
  .hour { width:130px; text-align:center; margin:0 17px; }
  .hour .t { font-size:16px; color:#4d6157; }
  .hour .icon { margin:10px 0 6px; }
  .hour .icon svg { width:44px; height:44px; }
  .hour .temp { font-family:"Fraunces",serif; font-size:26px; font-weight:500; }
  .hour .bar-wrap { height:46px; width:9px; background-color:#d9d2c1; border-radius:5px; margin:12px auto 6px; position:relative; }
  .hour .bar { position:absolute; bottom:0; left:0; right:0; background-color:#4f7cac; border-radius:5px; }
  .hour .pct { font-size:14px; color:#4d6157; }

  .foot { -webkit-box-flex:0; -webkit-flex:0 0 auto; flex:0 0 auto;
    padding:18px 0 24px; font-size:14px; color:#4d6157; text-align:center; }
  .msg { padding:40px 0; color:#4d6157; font-size:18px; text-align:center; width:100%; }
</style>
</head>
<body>
<div id="stage">

  <div class="head">
    <h1>Mankolan koulun sää</h1>
    <div class="when" id="when">–</div>
  </div>

  <div class="now" id="now">
    <div class="msg">Haetaan säätä…</div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="section-title">Seuraavat tunnit</div>
  <div class="hours" id="hours"></div>

  <div class="foot" id="foot"></div>
</div>

<!-- Itse piirretyt viivaikonit -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="0" height="0" style="position:absolute">
  <symbol id="ic-sun" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <circle cx="24" cy="24" r="10"></circle>
    <path d="M24 4v6M24 38v6M4 24h6M38 24h6M9.5 9.5l4.2 4.2M34.3 34.3l4.2 4.2M9.5 38.5l4.2-4.2M34.3 13.7l4.2-4.2"></path>
  </symbol>
  <symbol id="ic-partly" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="17" cy="16" r="7"></circle>
    <path d="M17 4v4M6 16h4M27 9.5l-3 3"></path>
    <path d="M15 34h18a7 7 0 0 0 1-13.9A10 10 0 0 0 15 24.6 6 6 0 0 0 15 34z"></path>
  </symbol>
  <symbol id="ic-cloud" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 34h22a8 8 0 0 0 1-15.9A11 11 0 0 0 14 24.9 7 7 0 0 0 13 34z"></path>
  </symbol>
  <symbol id="ic-fog" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <path d="M13 22h22a8 8 0 0 0 1-15.9A11 11 0 0 0 14 12.9 7 7 0 0 0 13 22z"></path>
    <path d="M8 30h32M8 37h32"></path>
  </symbol>
  <symbol id="ic-rain" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <path d="M13 24h22a8 8 0 0 0 1-15.9A11 11 0 0 0 14 14.9 7 7 0 0 0 13 24z"></path>
    <path d="M16 32l-2 6M24 32l-2 6M32 32l-2 6"></path>
  </symbol>
  <symbol id="ic-snow" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <path d="M13 22h22a8 8 0 0 0 1-15.9A11 11 0 0 0 14 12.9 7 7 0 0 0 13 22z"></path>
    <path d="M16 30v8M12 34h8M30 30v8M26 34h8"></path>
  </symbol>
  <symbol id="ic-storm" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 21h22a8 8 0 0 0 1-15.9A11 11 0 0 0 14 11.9 7 7 0 0 0 13 21z"></path>
    <path d="M25 26l-6 9h6l-4 8"></path>
  </symbol>
</svg>

<script type="text/javascript">
var STAGE_W = 1345, STAGE_H = 980;
var LAT = 62.27, LON = 25.715, HOURS_SHOWN = 6;

var GROUP = {
  0:"sun", 1:"sun",
  2:"partly",
  3:"cloud",
  45:"fog", 48:"fog",
  51:"rain",53:"rain",55:"rain",56:"rain",57:"rain",
  61:"rain",63:"rain",65:"rain",66:"rain",67:"rain",
  80:"rain",81:"rain",82:"rain",
  71:"snow",73:"snow",75:"snow",77:"snow",85:"snow",86:"snow",
  95:"storm",96:"storm",99:"storm"
};
var DESC = {
  sun:"selkeää", partly:"puolipilvistä", cloud:"pilvistä", fog:"sumuista",
  rain:"sateista", snow:"lumisadetta", storm:"ukkosta"
};
function group(code){ return GROUP[code] || "cloud"; }
function iconSvg(code, size){
  var id = "ic-" + group(code);
  return '<svg width="' + size + '" height="' + size + '">' +
           '<use href="#' + id + '" xlink:href="#' + id + '"></use>' +
         '</svg>';
}
function pad(n){
  n = parseInt(n, 10);
  return (n < 10 ? "0" : "") + n;
}
var WD = ["su","ma","ti","ke","to","pe","la"];

function fit(){
  var st = document.getElementById("stage");
  var sx = window.innerWidth / STAGE_W;
  var sy = window.innerHeight / STAGE_H;
  st.style.webkitTransform = "scale(" + sx + "," + sy + ")";
  st.style.transform = "scale(" + sx + "," + sy + ")";
  st.style.left = "0px";
  st.style.top = "0px";
}
if (window.addEventListener) {
  window.addEventListener("resize", fit, false);
} else if (window.attachEvent) {
  window.attachEvent("onresize", fit);
}
fit();

function renderNow(cur, rainProb){
  document.getElementById("now").innerHTML =
    '<div class="icon">' + iconSvg(cur.weather_code, 100) + '</div>' +
    '<div class="temp">' + Math.round(cur.temperature_2m) + '°</div>' +
    '<div class="desc">' + DESC[group(cur.weather_code)] + '</div>';
  document.getElementById("stats").innerHTML =
    '<div class="stat"><div class="label">tuntuu kuin</div><div class="value">' + Math.round(cur.apparent_temperature) + '°</div></div>' +
    '<div class="stat"><div class="label">tuuli</div><div class="value">' + Math.round(cur.wind_speed_10m) + ' m/s</div></div>' +
    '<div class="stat"><div class="label">sade nyt</div><div class="value">' + (rainProb != null ? rainProb : 0) + ' %</div></div>';
}

function renderHours(times, temps, codes, probs, nowIso){
  var start = 0;
  var i, j;
  for (i = 0; i < times.length; i++){ if (times[i] >= nowIso){ start = i; break; } }
  var html = "";
  for (j = start; j < start + HOURS_SHOWN && j < times.length; j++){
    var d = new Date(times[j]);
    var p = probs[j] != null ? probs[j] : 0;
    html += '<div class="hour">' +
              '<div class="t">' + pad(d.getHours()) + '</div>' +
              '<div class="icon">' + iconSvg(codes[j], 44) + '</div>' +
              '<div class="temp">' + Math.round(temps[j]) + '°</div>' +
              '<div class="bar-wrap"><div class="bar" style="height:' + p + '%"></div></div>' +
              '<div class="pct">' + p + '%</div>' +
            '</div>';
  }
  document.getElementById("hours").innerHTML = html;
  return start;
}

function showError(msg){
  document.getElementById("now").innerHTML = '<div class="msg">' + msg + '</div>';
}

function load(){
  var url = "https://api.open-meteo.com/v1/forecast" +
    "?latitude=" + LAT + "&longitude=" + LON +
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m" +
    "&hourly=temperature_2m,precipitation_probability,weather_code" +
    "&timezone=Europe%2FHelsinki&forecast_days=2";

  var xhr = new XMLHttpRequest();
  var finished = false;

  try {
    xhr.open("GET", url, true);
    xhr.timeout = 15000;
  } catch (e) {
    showError("Selain ei pystynyt alustamaan hakua.");
    return;
  }

  xhr.onreadystatechange = function(){
    if (xhr.readyState === 4 && !finished){
      finished = true;
      if (xhr.status === 0){
        showError("Ei yhteyttä säänhakuun. Yritetään pian uudelleen.");
        return;
      }
      if (xhr.status >= 200 && xhr.status < 300){
        try {
          var data = JSON.parse(xhr.responseText);
          var start = renderHours(data.hourly.time, data.hourly.temperature_2m, data.hourly.weather_code,
                                   data.hourly.precipitation_probability, data.current.time);
          renderNow(data.current, data.hourly.precipitation_probability[start]);
          var now = new Date();
          document.getElementById("when").innerHTML = WD[now.getDay()] + " " + now.getDate() + "." + (now.getMonth() + 1) + ".";
          document.getElementById("foot").innerHTML = "päivitetty " + pad(now.getHours()) + ":" + pad(now.getMinutes());
        } catch (parseErr){
          showError("Virhe vastauksen käsittelyssä.");
        }
      } else {
        showError("Säätietojen haku epäonnistui (HTTP " + xhr.status + ").");
      }
    }
  };

  xhr.onerror = function(){
    if (finished) { return; }
    finished = true;
    showError("Verkkovirhe säätietoja haettaessa.");
  };

  xhr.ontimeout = function(){
    if (finished) { return; }
    finished = true;
    showError("Aikakatkaisu säätietoja haettaessa.");
  };

  try {
    xhr.send();
  } catch (sendErr){
    showError("Pyynnön lähetys epäonnistui.");
  }
}

load();
setInterval(load, 10 * 60 * 1000);
</script>
</body>
</html>
